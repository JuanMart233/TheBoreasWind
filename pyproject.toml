[project]
name = "BoreasWind"
version = "0.1.0"
description = "BoreasWind application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bcrypt>=5.0.0",
    "flet>=0.82.2",
    "mysql-connector-python>=9.6.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
]

[project.scripts]
app= "main:main"

[tool.uv]
package = true

[tool.setuptools.package-dir]
""="src"